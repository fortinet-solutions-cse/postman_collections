---
fmg_host: 192.168.0.15
fmg_user: admin
fmg_adom: CustomerS

postman_collection: tenants/shared/Managed_SDWAN_7_6_x_sov.postman.json
default_skip_tags: fine-tune-sase,bor

fgfm_ip: 192.168.0.15
fgt_user: admin

sites:
  site1-1:
    ip: 192.168.0.31
  site1-2:
    ip: 192.168.0.32
  site2-1:
    ip: 192.168.0.33
  site1-H1:
    ip: 192.168.0.41
  site1-H2:
    ip: 192.168.0.42
  site2-H1:
    ip: 192.168.0.43

tasks:
  - name: Create Foundation
    type: postman
    folder: Foundation
    tag: foundation
  - name: Create Variables
    type: postman
    folder: CustomerS - Variables
    tag: foundation    
  - name: Import Project Template
    type: cli_templates
    src: tenants/CustomerS/Project.j2
    rename: 00-Project
    tag: mixed
  - name: Import Jinja CLI Templates
    type: cli_templates
    src: tenants/shared/sdwan-advpn-reference-hol-4.0/dynamic-bgp-on-lo/*.j2
    tag: foundation
  - name: Create CLI Template Groups
    type: postman
    folder: Create CLI Template Groups
    tag: foundation
  - name: Finalize Foundation
    type: postman
    folder: CustomerS - Finalize
    vars: tenants/CustomerS/postman.vars.yaml
    tag: foundation
  - name: Fine-tune for Uni-SASE
    type: postman
    folder: CustomerS - Fine-tune Uni-SASE
    tag: fine-tune-sase
  - name: Create Model Devices - West-only
    type: model_devices
    src: tenants/CustomerS/inventory.CustomerS.csv
    fos: 7.6
    tag: west-only 
  - name: Install Model Devices (Staging) - West-only
    type: postman
    folder: CustomerS - Staging West
    tag: west-only
  - name: Onboard Devices - West-only
    type: onboard
    src: tenants/CustomerS/inventory.CustomerS.csv
    monitor: yes
    retry: yes
    tag: west-only
  - name: Deploy BOR
    type: postman
    folder: CustomerS - BOR
    tag: bor