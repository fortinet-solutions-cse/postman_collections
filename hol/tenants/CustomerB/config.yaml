---
fmg_host: 192.168.0.15
fmg_user: admin
fmg_adom: CustomerB

postman_collection: tenants/shared/Managed_SDWAN_8_0_x.postman.json

fgfm_ip: 192.168.0.15
fgt_user: admin

sites:
  site1-1:
    ip: 192.168.0.31
  site1-2:
    ip: 192.168.0.32
  site1-H1:
    ip: 192.168.0.41
  site1-H2:
    ip: 192.168.0.42
  site2-H1:
    ip: 192.168.0.43

tasks:
  - name: Create Foundation
    type: postman
    folder: Foundation
    tag: foundation
  - name: Create Variables
    type: postman
    folder: CustomerB - Variables
    tag: foundation
  - name: Import Project Template 
    type: cli_templates
    src: tenants/CustomerB/00-Project.multivrf.generic.j2
    rename: 00-Project
    tag: foundation
  - name: Import Jinja CLI Templates
    type: cli_templates
    src: tenants/shared/sdwan-advpn-reference-hol-5.0/dynamic-bgp-on-lo/*.j2
    tag: foundation
  - name: Create CLI Template Groups
    type: postman
    folder: Create CLI Template Groups
    tag: foundation
  - name: Finalize Foundation
    type: postman
    folder: CustomerB - Finalize
    tag: foundation
  - name: Provide Internet Access
    type: postman
    folder: CustomerB - Provide Internet Access
    tag: lab
  - name: Create Model Devices
    type: model_devices
    src: tenants/CustomerB/inventory.CustomerB.csv
    fos: 8.0
    tag: model_devices
  - name: Install Model Devices (Staging)
    type: postman
    folder: CustomerB - Staging
    tag: staging
  - name: Onboard Devices
    type: onboard
    src: tenants/CustomerB/inventory.CustomerB.csv
    monitor: yes
    retry: yes
    tag: onboard
  - name: Shared Resource
    type: apply_cli
    src: tenants/CustomerB/shared_res/*.j2
    tag: lab,shared_res
