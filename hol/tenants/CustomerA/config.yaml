---
fmg_host: 192.168.0.15
fmg_user: admin
fmg_adom: CustomerA

postman_collection: tenants/shared/Managed_SDWAN_8_0_x.postman.json

fgfm_ip: 192.168.0.15
fgt_user: admin

sites:
  site1-1:
    ip: 192.168.0.31
  site1-2:
    ip: 192.168.0.32
  site2-1:
    ip: 192.168.0.33
  site1-H1:
    ip: 192.168.0.41
  site1-H2:
    ip: 192.168.0.42
  site2-H1:
    ip: 192.168.0.43

tasks:
  - name: Create Foundation
    type: postman
    folder: Foundation
    tag: foundation
  - name: Create Variables
    type: postman
    folder: CustomerA - Variables
    tag: foundation
  - name: Import Project Template 
    type: cli_templates
    src: tenants/CustomerA/00-Project.generic.j2
    rename: 00-Project
    tag: foundation
  - name: Import Jinja CLI Templates
    type: cli_templates
    src: tenants/shared/sdwan-advpn-reference-hol-5.0/dynamic-bgp-on-lo/*.j2
    tag: foundation
  - name: Create CLI Template Groups
    type: postman
    folder: Create CLI Template Groups
    tag: foundation
  - name: Finalize Foundation
    type: postman
    folder: CustomerA - Finalize
    tag: foundation
  - name: Create Model Devices
    type: model_devices
    src: tenants/CustomerA/inventory.CustomerA.csv
    fos: 8.0
    admin_user: admin
    tag: model_devices
  - name: Prepare Legacy Site
    type: postman
    folder: CustomerA - Legacy Site
    tag: legacy_site
  - name: Create Model Device for Legacy Site
    type: model_devices
    src: tenants/CustomerA/inventory.legacysite_CustomerA.csv
    fos: 8.0
    admin_user: admin
    adom: OUTSIDE
    tag: legacy_site
  - name: Connect to Legacy Site
    type: postman
    folder: CustomerA - Hubs-to-Legacy
    tag: legacy_site
  - name: Remote Health Signaling
    type: postman
    folder: CustomerA - Remote Health Signaling
    tag: lab    
  - name: SD-Branch Templates
    type: postman
    folder: CustomerA - SD-Branch
    tag: lab
  - name: Install Model Devices (Staging)
    type: postman
    folder: CustomerA - Staging
    tag: staging
  - name: Onboard Devices
    type: onboard
    src: tenants/CustomerA/inventory.all_CustomerA.csv
    monitor: yes
    retry: yes
    tag: onboard
